[package]
name = "cheers-test-support"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "In-process test fixtures for cheers — turso :memory: backed stores, session + edge-verify helpers. Dev/test only; never ship to production."
publish = false

[lib]
name = "cheers_test_support"
path = "src/lib.rs"

[dependencies]
cheers-core = { path = "../cheers-core", version = "0.8.21" }
cheers-server = { path = "../cheers-server", version = "0.8.21" }
cheers-verify = { path = "../cheers-verify", version = "0.8.21" }

async-trait = "0.1"
turso = { workspace = true }

# R592-F3 golden-token fixtures (src/fixtures.rs): low-level PASETO v4.public
# signing (matching the house convention kamaji-bin / cheers-mock / yubaba
# already share — raw JSON payload + kid-in-footer, NOT pasetors' high-level
# Claims wrapper) plus deterministic Ed25519 key derivation from the pinned
# fixture seed. `ed25519-compact` mirrors cheers-server's own direct dep
# (pasetors already pulls it transitively for its V4 codec).
pasetors = "0.7"
ed25519-compact = { version = "2", default-features = false }
base64ct = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
cheers-server = { path = "../cheers-server", version = "0.8.21" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
