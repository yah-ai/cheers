# release-plz configuration for the cheers workspace.
#
# Publish with:  release-plz release --backend github
#
# cheers-core is published first because cheers depends on it. release-plz
# detects the dependency order from Cargo.toml and publishes in topological
# order. The path dep `cheers-core = { path = "../cheers-core", version = "0.0.1" }`
# in cheers's Cargo.toml is rewritten to a registry dep before publication.

[workspace]
# One tag per crate: cheers-core-v0.0.1, cheers-v0.0.1
git_tag_name = "{{package}}-v{{version}}"
publish_timeout = "300s"

[[package]]
name = "cheers-core"
# cheers-core publishes first; no special overrides needed.

[[package]]
name = "cheers"
# release-plz waits for cheers-core to appear on crates.io before publishing.
